<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Aura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center relative px-4">
  <div class="radial-glow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
  
  <div class="w-full max-w-md glass-panel p-8 rounded-3xl relative z-10 shadow-2xl">
    <div class="text-center mb-8">
      <h2 id="auth-title" class="serif-title text-3xl font-medium text-white mb-2">Welcome Back</h2>
      <p id="auth-subtitle" class="text-gray-400 text-sm">Enter your credentials to access your luxury writer hub.</p>
    </div>

    <form id="auth-form" class="space-y-5">
      <div id="signup-fields" class="space-y-5 hidden">
        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
          <input type="text" id="fullname" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Sarah Jenkins">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Username</label>
          <input type="text" id="username" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors" placeholder="sarahj">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
        <input type="email" id="email" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors" placeholder="you@domain.com">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••">
          <button type="button" id="toggle-pwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="login-options" class="flex items-center justify-between text-xs text-gray-400">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" class="rounded bg-white/5 border-white/10 text-indigo-600 focus:ring-0">
          <span>Remember me</span>
        </label>
        <a href="#" class="hover:text-white transition-colors">Forgot Password?</a>
      </div>

      <button type="submit" class="w-full bg-white text-gray-900 py-3.5 rounded-xl font-semibold text-sm hover:bg-gray-100 transition-all transform active:scale-[0.98] mt-2 shadow-lg">
        <span id="submit-btn-text">Sign In</span>
      </button>
    </form>

    <div class="text-center mt-8 pt-6 border-t border-white/5 text-sm text-gray-400">
      <span id="switch-text">Don't have an account?</span>
      <button id="switch-auth-mode" class="text-white font-medium ml-1 underline hover:text-indigo-300 transition-colors">Sign up</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
