name: Prime Factorization

on:
  workflow_dispatch:

jobs:
  compute-factors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk:
          - { id: 1, start: 1, end: 200 }
          - { id: 2, start: 201, end: 400 }
          - { id: 3, start: 401, end: 600 }
          - { id: 4, start: 601, end: 800 }
          - { id: 5, start: 801, end: 1000 }

    steps:
      - name: Set up PyPy3
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.10'

      - name: Calculate Range in Python
        run: |
          cat << 'EOF' > factorize.py
          import gzip
          import sys
          from multiprocessing import Pool, cpu_count

          def factorize(n):
              factors = []
              temp = n
              
              # Wheel factorization logic (trial division optimization)
              while temp % 2 == 0:
                  factors.append(2)
                  temp //= 2
              while temp % 3 == 0:
                  factors.append(3)
                  temp //= 3
                  
              d = 5
              while d * d <= temp:
                  while temp % d == 0:
                      factors.append(d)
                      temp //= d
                  while temp % (d + 2) == 0:
                      factors.append(d + 2)
                      temp //= (d + 2)
                  d += 6
                  
              if temp > 1:
                  factors.append(temp)
                  
              return f"{n}: " + " ".join(map(str, factors)) + "\n"

          def process_subchunk(args):
              sub_start, sub_end = args
              lines = []
              for n in range(sub_start, sub_end + 1):
                  lines.append(factorize(n))
              return "".join(lines)

          if __name__ == "__main__":
              start_num = int(sys.argv[1])
              end_num = int(sys.argv[2])
              out_file = sys.argv[3]

              num_workers = cpu_count()
              batch_size = 50000  # Numbers processed per core per task batch
              
              # Generate sub-ranges for worker processes
              tasks = []
              curr = start_num
              while curr <= end_num:
                  nxt = min(curr + batch_size - 1, end_num)
                  tasks.append((curr, nxt))
                  curr = nxt + 1

              # Process with worker pool and stream directly to compressed file
              with gzip.open(out_file, "wt", encoding="utf-8") as f:
                  with Pool(processes=num_workers) as pool:
                      for result_chunk in pool.imap(process_subchunk, tasks, chunksize=4):
                          f.write(result_chunk)

          EOF

          START=${{ matrix.chunk.start }}
          END=${{ matrix.chunk.end }}
          ID=${{ matrix.chunk.id }}

          python3 factorize.py $START $END "chunk_${ID}.txt.gz"

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorization-part-${{ matrix.chunk.id }}
          path: chunk_${{ matrix.chunk.id }}.txt.gz

  merge-results:
    needs: compute-factors
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: compressed_chunks

      - name: Merge Python Outputs
        run: |
          mkdir final_output
          # Stream decompress into one combined output file
          zcat compressed_chunks/factorization-part-*/*.txt.gz > final_output/prime_factorization_1B.txt
          echo "Finished merging. Total size: $(du -sh final_output/prime_factorization_1B.txt | cut -f1)"

      - name: Upload Final Output
        uses: actions/upload-artifact@v4
        with:
          name: prime-factorization-1_to_1B
          path: final_output/prime_factorization_1B.txt
