name: Prime Factorization (Fast Chunks)

on:
  push:

jobs:
  generate-chunks:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.set-matrix.outputs.chunks }}
    steps:
      - id: set-matrix
        run: |
          # Creates 100 chunks of 10,000,000 numbers each
          CHUNKS=$(python3 -c '
          import json
          total = 1000000000
          step = 10000000
          chunks = []
          idx = 1
          for start in range(1, total + 1, step):
              end = min(start + step - 1, total)
              chunks.append({"id": idx, "start": start, "end": end})
              idx += 1
          print(json.dumps(chunks))
          ')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT

  compute-factors:
    needs: generate-chunks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15 # Runs 15 jobs at once within free-tier concurrency limits
      matrix:
        chunk: ${{ fromJSON(needs.generate-chunks.outputs.chunks) }}

    steps:
      - name: Set up PyPy3
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.10'

      - name: Calculate Factorization
        run: |
          cat << 'EOF' > factorize.py
          import gzip
          import sys
          from multiprocessing import Pool, cpu_count

          def factorize(n):
              factors = []
              temp = n
              while temp % 2 == 0:
                  factors.append(2)
                  temp //= 2
              while temp % 3 == 0:
                  factors.append(3)
                  temp //= 3
              d = 5
              while d * d <= temp:
                  while temp % d == 0:
                      factors.append(d)
                      temp //= d
                  while temp % (d + 2) == 0:
                      factors.append(d + 2)
                      temp //= (d + 2)
                  d += 6
              if temp > 1:
                  factors.append(temp)
              return f"{n}: " + " ".join(map(str, factors)) + "\n"

          def process_subchunk(args):
              sub_start, sub_end = args
              return "".join(factorize(n) for n in range(sub_start, sub_end + 1))

          if __name__ == "__main__":
              start_num = int(sys.argv[1])
              end_num = int(sys.argv[2])
              out_file = sys.argv[3]

              num_workers = cpu_count()
              batch_size = 20000
              tasks = []
              curr = start_num
              while curr <= end_num:
                  nxt = min(curr + batch_size - 1, end_num)
                  tasks.append((curr, nxt))
                  curr = nxt + 1

              with gzip.open(out_file, "wt", encoding="utf-8") as f:
                  with Pool(processes=num_workers) as pool:
                      for result_chunk in pool.imap(process_subchunk, tasks, chunksize=4):
                          f.write(result_chunk)
          EOF

          START=${{ matrix.chunk.start }}
          END=${{ matrix.chunk.end }}
          ID=${{ matrix.chunk.id }}

          python3 factorize.py $START $END "chunk_${ID}.txt.gz"

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorization-part-${{ matrix.chunk.id }}
          path: chunk_${{ matrix.chunk.id }}.txt.gz

  merge-results:
    needs: compute-factors
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: compressed_chunks

      - name: Merge Python Outputs
        run: |
          mkdir final_output
          zcat compressed_chunks/factorization-part-*/*.txt.gz > final_output/prime_factorization_1B.txt
          echo "Finished merging. Total size: $(du -sh final_output/prime_factorization_1B.txt | cut -f1)"

      - name: Upload Final Output
        uses: actions/upload-artifact@v4
        with:
          name: prime-factorization-1_to_1B
          path: final_output/prime_factorization_1B.txt
