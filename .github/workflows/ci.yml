name: CI

on:
  push:
    branches:
      - "feature/**"
      - "dev"

permissions:
  contents: write

env:
  IMAGE_NAME: blogora-image
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  pylint:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Run pylint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            bash tools/pylint.sh

      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
            ${{ secrets.NEXUS_REGISTRY }} \
            --username "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            ${{ secrets.NEXUS_REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.NEXUS_REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Logout from Nexus
        if: always()
        run: |
          docker logout ${{ secrets.NEXUS_REGISTRY }}

      # THIS STEP TRIGGERS THE CD BY UPDATING THE MANIFEST
      - name: Update Image Tag in Deployment Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # If deployment files are in a different repo, you'd clone it here first.
          # Modifying the deployment file using sed (or yq)
          sed -i "s|image: ${{ secrets.NEXUS_REGISTRY }}/${IMAGE_NAME}:.*|image: ${{ secrets.NEXUS_REGISTRY }}/${IMAGE_NAME}:${IMAGE_TAG}|g" deploy/deployment.yaml

          git add deploy/deployment.yaml
          git commit -m "chore: update web-app image tag to ${IMAGE_TAG} [skip ci]"
          git push
